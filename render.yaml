services:
  - type: web
    name: ethiopia-conflict-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false                     # Set in Render dashboard
      - key: CORS_ORIGINS
        sync: false                     # Set to frontend URL after first deploy, e.g.:
                                        # https://ethiopia-conflict-frontend.onrender.com

  - type: web
    name: ethiopia-conflict-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false                     # Set to https://ethiopia-conflict-backend.onrender.com
