[project]
name = "ethiopia-conflict-backend"
version = "0.1.0"
description = "FastAPI backend for the Ethiopia Conflict Monitor"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "fastapi>=0.115.0",
  "geopandas>=0.14.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.0",
  "pandas>=2.0.0",
  "pydantic>=2.0.0",
  "pyproj>=3.6.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "shapely>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]
